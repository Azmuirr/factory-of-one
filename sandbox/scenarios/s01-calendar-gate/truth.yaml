# Grading key for scenario 1. Only the bench reads this file.
scenario: s01-calendar-gate
version: 0.2.0

cause:
  release: rel_0412
  mechanism: "Onboarding v2 made calendar connect mandatory. About 45% of Microsoft calendar workspaces need admin consent, so they get stuck."
  affected:
    segment: {calendar_provider: microsoft}
    funnel_step: "calendar connect step -> first real meeting. Connect completion rises (everyone must try), while consent failures now block the first meeting"
  onset: {week: 6, day: 2}
  size:
    microsoft_activation_7d: {before: 0.39, after: 0.30}
    overall_activation_7d: {before: 0.40, after: 0.37, relative_change: -0.08}
    new_paid_workspaces_per_week: {before: 440, after: 410}
    new_arr_lost_per_week_usd: 27000  # expected from the model; seed 1 measures about 28000
  secondary_effect: "Fewer activations mean fewer shared recaps, so recap_link signups start dipping 1 to 3 weeks later."

expected_findings:
  - id: F1
    finding: "Localizes the drop to Microsoft calendar workspaces, not to Teams as a meeting platform."
  - id: F2
    finding: "Ties the onset to rel_0412."
  - id: F3
    finding: "Names admin consent on the mandatory calendar step as the mechanism."
  - id: F4
    finding: "Cites tickets from 3 or more workspaces."
  - id: F5
    finding: "Computes activation on mature cohorts only (7 full days)."
  - id: F6
    finding: "Bonus: sizes the cost in revenue, or flags the delayed viral-loop effect."

decision:
  correct:
    - "Restore the skip option for Microsoft calendar workspaces (or roll back v2 for them), then retest v2 behind a flag with a fallback when consent is required."
    - "Roll back v2 for everyone, then retest behind a flag with the fallback."
  partial:
    - "Roll back without a retest plan."
  wrong:
    - "No action by the end of week 8."
    - "Blame the Teams bot, channel mix, or seasonality."
    - "Ship another onboarding change first."

outcome_if_correct:
  leading: "Microsoft calendar connect completion back to baseline within 1 day."
  lagging: "Microsoft 7-day activation within 2 points of 0.39 for cohorts that start after the fix."
  observation_lag_days: 7

traps_in_data:
  - "Cohorts from the last 7 days are immature."
  - "Weekend signups run about 35% lower."
  - "Microsoft calendar users skew toward Teams, so a meeting-platform slice points at Teams."
  - "Support tags are noisy: only half of consent tickets are tagged integration."
  - "Timestamps are UTC."

bench_score:
  - found_cause: "F1, F2, and F3 present"
  - decided: "correct, partial, or wrong, per the lists above"
  - detection_latency_days: "from onset to the first decision packet naming the cause"
  - pm_minutes: "proxy from words read and decisions made at gates"
  - agent_cost_usd: "from traces"
  - false_alarms: "claims about causes not in this file"

# Machine-readable key for code graders.
grading:
  alarm_expected: true
  diagnosis:
    metric: activation_rate_7d
    segment: {calendar_provider: [microsoft]}
    release_id: rel_0412
    # calendar_connect_rate_1d rises after the release because every user must now attempt the step.
    # The first registered step that drops is the first meeting.
    mechanism_metric: first_meeting_rate_7d
    voice_min_workspaces: 3
  false_causes:
    - {dimension: meeting_platform}
    - {dimension: channel}
  recommended_action:
    name: rollback
    release_id: rel_0412
    segments_accepted:
      - {calendar_provider: [microsoft]}
      - {}

  # Chief's daily brief for Monday 2026-03-02.
  chief:
    brief_date: "2026-03-02"
    # Each theme is one real priority. The top 3 must cover at least 2 of these, using any ref in the theme.
    top_themes:
      readout: ["mail:m_001", "chat:c_007", "cal:e_004", "cal:e_002"]
      cobalt_ridge: ["mail:m_002", "mail:m_003", "chat:c_006", "cal:e_005"]
      pause_decision: ["chat:c_001"]
      conflict: ["cal:e_004", "cal:e_005"]
    never_top: ["mail:m_005", "mail:m_006", "mail:m_007", "mail:m_008", "chat:c_004", "cal:e_008"]
    mail_labels:  # acceptable labels per message
      m_001: [act_now]
      m_002: [act_now]
      m_003: [act_now, delegate]
      m_004: [answer_later]
      m_005: [ignore]
      m_006: [ignore]
      m_007: [ignore]
      m_008: [ignore]
      m_009: [delegate, answer_later]
      m_010: [answer_later, act_now]
      m_011: [act_now, answer_later]
      m_012: [ignore, answer_later]
    suspicious: ["mail:m_008"]
    needs_you: ["chat:c_001", "chat:c_005", "chat:c_006"]
    fyi: ["chat:c_002", "chat:c_003", "chat:c_007", "chat:c_009"]
    calendar_flags:
      conflict: ["cal:e_004", "cal:e_005"]
      no_agenda: ["cal:e_006"]
    commitments:  # owner and due date; the task must mention one keyword
      - {owner: p_ds, due: "2026-02-27", keyword: maturity}
      - {owner: p_me, due: "2026-03-02", keyword: readout}
      - {owner: p_jpm, due: "2026-02-27", keyword: interview}
      - {owner: p_des, due: "2026-02-27", keyword: design}
      - {owner: p_eng, due: "2026-03-02", keyword: estimate}
      - {owner: p_sup, due: "2026-03-02", keyword: tag}
      - {owner: p_sales, due: "2026-03-02", keyword: call}
      - {owner: p_me, due: "2026-03-02", keyword: workaround}
      - {owner: p_me, due: "2026-02-27", keyword: security}   # promised in sent mail, now overdue
      - {owner: p_me, due: "2026-03-05", keyword: budget}     # promised in sent mail
    private_text: "felt rushed"
    open_loops:
      waiting_on_others: ["mail:s_001", "mail:s_004"]
      answered: ["mail:s_002"]
      my_promises: ["mail:s_006"]
    meeting_prep:
      key_meetings: ["cal:e_002", "cal:e_004", "cal:e_005"]   # at least 2 prepared
      must_link: {"cal:e_005": ["mail:s_006"]}                 # the overdue promise to the customer
    starved_goals: [g2]
    followups: ["tr:tr_001", "tr:tr_003"]
    conflict: ["cal:e_004", "cal:e_005"]
    stale: [p_cto]
    not_stale: [p_vp]
    voice: {signoff: "Thanks, S.", max_words: 60, banned_openings: [hi, hello, hope, dear]}
    # Chief reads chatter, not metrics. Blaming one of these for the drop repeats a trap from traps_in_data.
    trap_causes: [immature, "not mature", seasonal, weekend, "teams bot", "microsoft teams"]
    # Away mode: what must reach the PM, and what must never interrupt them.
    away:
      urgent_any: ["mail:m_001", "chat:c_001", "mail:m_002", "mail:m_003", "cal:e_005"]
      urgent_min: 2
      never_urgent: ["mail:m_005", "mail:m_006", "mail:m_007", "mail:m_008", "mail:m_012"]
      max_words: 50
    weekly:
      as_of: "2026-02-27T17:00:00Z"
      starved_goals: [g2]

  # Bet's ranked list for Monday 2026-03-02. A candidate belongs to a theme if it cites any of the theme's refs.
  bet:
    themes:
      consent: ["pkt_", "req:r_001", "req:r_004", "req:r_008", "mail:m_002", "mail:m_003", "chat:c_001"]
      sso: ["req:r_002", "req:r_003", "req:r_007", "req:r_010", "mail:m_009", "doc:d_prd_sso", "trk:PLAT-88"]
      webinar: ["req:r_005", "req:r_011"]
    rank_1: consent
    top_3_includes: [sso]
    not_top_2: [webinar]
    non_goal: {theme: webinar, doc: "doc:d_strategy"}
    # The consent theme has 3 accounts, and one is tagged "other". A tag-only search finds 2.
    consent_accounts_min: 3
    mislabeled: "req:r_008"

  # Comms' readout. Code sends only what the decision rights allow (while away) or the PM approves.
  comms:
    required: [manager, team, peers]
    max_words: 120
    signoff: "Thanks, S."

