# Docs the PM can read: strategy and product docs. Bet reads these to tie work to strategy.
docs:
  - id: d_strategy
    title: "Tallybird H1 2026 strategy"
    owner: p_ceo
    updated: "2026-01-08T16:00:00Z"
    body: |
      Three bets for the first half.
      1. Activation. Every new workspace records and shares a real meeting in its first week. We measure 7-day activation, and we want it at 45% by June.
      2. Upmarket. Launch the Business plan with SSO and admin controls by the end of Q2, and sign 30 Business customers.
      3. Hiring. Add a senior PM to Growth.
      Not this half: new meeting formats such as webinars, custom work for a single customer, compliance programs such as HIPAA, and a mobile rewrite.
      How we decide: prefer bets we can reverse, give each bet one number, and revisit the list every month.
  - id: d_prd_v2
    title: "PRD: Onboarding v2, connect calendar first"
    owner: p_me
    updated: "2026-01-20T18:00:00Z"
    body: |
      Problem: workspaces that skip calendar connect rarely record a meeting, so they rarely activate.
      Proposal: make calendar connect the first step and remove the skip button, so the notetaker joins the user's next meeting on its own.
      Success: calendar connect rises, and 7-day activation follows.
      Risks: some Microsoft 365 tenants require an admin to approve calendar apps. We expect this to be rare and will watch support tickets.
      Rollout: everyone at once, without a flag, to learn fast.
  - id: d_prd_sso
    title: "PRD draft: SSO for the Business plan"
    owner: p_ppm
    updated: "2026-02-20T15:00:00Z"
    body: |
      Goal: SSO and admin controls on the Business plan, launched by the end of Q2.
      Open questions for Growth: which identity providers come first (Okta, Microsoft Entra ID, Google Workspace), whether SCIM provisioning is required at launch, and how trials of the Business plan work.
      Platform plans the sprint starting March 9. Growth's requirements are needed by Wednesday, March 4, or the work moves to next quarter.
  - id: d_pipeline
    title: "Sales pipeline notes, Q1"
    owner: p_sales
    updated: "2026-02-26T19:00:00Z"
    body: |
      Most common blockers in open deals: SSO for the Business plan, and trials stuck on Outlook admin approval.
      Northwind Health, our largest prospect, asks for Zoom webinar recording and a HIPAA agreement before it would sign 600 seats.
      Smaller asks keep coming in for CRM sync and custom vocabulary.

