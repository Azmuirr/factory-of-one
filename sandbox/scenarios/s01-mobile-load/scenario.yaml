# Generator input for scenario 1. Hidden from agents: they see only the generated world.
id: s01-mobile-load
title: Activation drops after a signup change
version: 0.1.0
tier: easy
tiers_built: [easy]

clock:
  weeks: 10
  now: {week: 8, day: 7}
  post_action_weeks: [9, 10]

baseline: default  # sandbox/SPEC.md section 4

releases:
  - id: rel_0301
    at: {week: 2, day: 3}
    title: "Export: fix PDF margins"
    notes: "Fixes clipped margins on PDF export for long documents."
    platforms: [web, desktop]
    flag: null
    effects: []

  - id: rel_0318
    at: {week: 4, day: 2}
    title: "Summarize: faster responses on web"
    notes: "Streams summaries as they generate."
    platforms: [web]
    flag: null
    effects: []

  - id: rel_0412
    at: {week: 6, day: 2}
    title: "Signup flow v2: template gallery on first run"
    notes: "New users pick a starter template before their first draft. Template previews load on the first-run screen."
    platforms: [web, desktop, ios, android]
    flag: null
    effects:
      - kind: load_multiplier
        target: first_run
        by_platform: {web: 1.05, desktop: 1.00, ios: 2.10, android: 2.20}

text:
  tickets:
    - theme: slow_first_run_mobile
      eligible: "platform in [ios, android] and signup_week >= 6 and first_run_load_ms > 3500"
      file_rate: 0.04  # share of eligible workspaces that file a ticket; about 8 to 15 per week
      support_tag_mix: {bug-other: 0.6, performance: 0.4}
      template: templates/tickets/slow_first_run.txt
  reviews:
    - theme: slow_loading
      platforms: [ios, android]
      from_week: 6
      per_week: [10, 20]
      rating: [1, 2]
      template: templates/reviews/slow_loading.txt

messages:
  - at: {week: 7, day: 2}
    from_role: vp_product
    subject: "Activation dip"
    body: "Activation dipped on the weekly dashboard. What is going on, and what do you need from me?"
  - at: {week: 7, day: 4}
    from_role: support_lead
    subject: "Mobile tickets"
    body: "More 'app stuck loading' tickets from new mobile users this week. Not sure if it is related to anything."

actions_available: [rollback, set_flag, start_experiment, no_action]

# Specified now, built after the easy tier passes.
variants:
  medium:
    add:
      - "Paid social campaign from week 6: channel share 25% to 40%, lower intent, 60% mobile. A plausible wrong answer."
  hard:
    add:
      - "Release rel_0415 'Model update: new drafting model' at week 6 day 4, with no real effect."
      - "first_run_viewed carries no load_ms on ios or android. Voice is strong but usage is not instrumented."
      - "The VP message asks: 'Is this the new model?'"
    remove:
      - "The support lead message."
