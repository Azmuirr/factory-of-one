# Grading key for scenario 1. Only the bench reads this file.
scenario: s01-mobile-load
version: 0.1.0

cause:
  release: rel_0412
  mechanism: "First-run screen load time roughly doubled on iOS and Android."
  affected:
    platforms: [ios, android]
    funnel_step: "first_run_viewed -> draft_generated"
  onset: {week: 6, day: 2}
  size:
    mobile_activation_7d: {before: 0.36, after: 0.27}
    overall_activation_7d: {before: 0.41, after: 0.38, relative_change: -0.08}

expected_findings:
  - id: F1
    finding: "Localizes the drop to iOS and Android."
  - id: F2
    finding: "Ties the onset to rel_0412."
  - id: F3
    finding: "Names first-run load time as the mechanism."
  - id: F4
    finding: "Cites customer voice from 3 or more workspaces."
  - id: F5
    finding: "Computes activation on mature cohorts only (7 full days)."

decision:
  correct:
    - "Roll back rel_0412 on all platforms, then retest behind a flag with a load-time guardrail."
    - "Roll back rel_0412 on iOS and Android only, then retest behind a flag with a load-time guardrail."
  partial:
    - "Roll back without a retest plan."
  wrong:
    - "No action by the end of week 8."
    - "Attribute the drop to channel mix, the model, or seasonality."
    - "Ship another onboarding change first."

outcome_if_correct:
  leading: "Mobile first-run load median back to baseline within 1 day."
  lagging: "Mobile 7-day activation within 2 points of 0.36 for cohorts that start after the rollback."
  observation_lag_days: 7

traps_in_data:
  - "Cohorts from the last 7 days are immature."
  - "Weekend signups run about 35% lower."
  - "Timestamps are UTC."
  - "Support tags are noisy: 60% of slow-load tickets are tagged bug-other."
  - "Store reviews carry no workspace ID."

bench_score:
  - found_cause: "F1, F2, and F3 present"
  - decided: "correct, partial, or wrong, per the lists above"
  - detection_latency_days: "from onset to the first decision packet naming the cause"
  - pm_minutes: "proxy from words read and decisions made at gates"
  - agent_cost_usd: "from traces"
  - false_alarms: "claims about causes not in this file"
