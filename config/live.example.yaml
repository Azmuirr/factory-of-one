# Template for your own company. Copy to factory.yaml at the repo root and fill in every <...>.
# Numbers stay on the factory's own servers, pointed at your warehouse and your metric catalog.
# Everything else can use your vendors' MCP servers. Map only read tools. Anything that writes goes through a gate.
mode: live
company: company/<your-company>/context.md
catalogs: company/<your-company>/catalogs

servers:
  metrics:   {command: "{python}", args: [-m, factory.servers.metrics_server]}   # needs a warehouse adapter (planned)
  warehouse: {command: "{python}", args: [-m, factory.servers.warehouse_server]} # needs a warehouse adapter (planned)
  ledger:    {command: "{python}", args: [-m, factory.servers.ledger_server]}
  demos:     {command: "{python}", args: [-m, factory.servers.demos_server]}
  support:   {command: "<command that starts your help desk's MCP server>", args: [], env: {API_TOKEN: "${SUPPORT_API_TOKEN}"}}
  releases:  {command: "<command that starts your code host's or flag tool's MCP server>", args: []}
server_env:
  FACTORY_LEDGER: "{ledger}"
  FACTORY_AGENT: "{agent}"
  FACTORY_DEMOS: "{demos}"
  FACTORY_CATALOGS: "{catalogs}"

# capability: mcp__<server name above>__<that server's tool name>
capabilities:
  metrics.list: mcp__metrics__list_metrics
  metrics.get: mcp__metrics__get_metric
  metrics.compare: mcp__metrics__compare_periods
  metrics.size_impact: mcp__metrics__estimate_weekly_arr_impact
  warehouse.describe: mcp__warehouse__describe_tables
  warehouse.query: mcp__warehouse__query
  support.search: mcp__support__<ticket search tool>
  support.volume: mcp__support__<ticket count tool, or remove>
  support.get: mcp__support__<get ticket tool>
  releases.list: mcp__releases__<list releases tool>
  flags.state: mcp__releases__<read flag state tool>
  demo.publish: mcp__demos__publish_demo
  demo.check: mcp__demos__check_demo
  ledger.write: mcp__ledger__write_entry
  ledger.read: mcp__ledger__read_entries
