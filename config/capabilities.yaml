# The capability vocabulary. Skills name capabilities, never tools. Each install maps capabilities to its real tools.
# access: read; propose (queues something for a human gate); or self (writes only to the PM's own private channel).
# Nothing here sends to other people, changes, or deletes on its own.
version: 0.1.0

capabilities:
  metrics.list:
    description: List registered metrics with units, windows, allowed dimensions, and aliases
    access: read
  metrics.get:
    description: Compute one registered metric for a period, optionally filtered and grouped by dimensions. Numbers are validated
    access: read
  metrics.compare:
    description: Compare a registered metric across two periods, with a significance test for rates
    access: read
  metrics.size_impact:
    description: Weekly revenue at stake from a change in the key metric in a segment
    access: read
  warehouse.describe:
    description: List warehouse tables and columns
    access: read
  warehouse.query:
    description: Run one read-only SQL query. Answers are exploratory
    access: read
  support.search:
    description: Search support tickets by keywords, dates, and segment. Returns distinct accounts
    access: read
  support.volume:
    description: Ticket counts by week and tag
    access: read
  support.get:
    description: Fetch one ticket
    access: read
  releases.list:
    description: Release notes in a date range
    access: read
  flags.state:
    description: Current and past feature-flag settings
    access: read
  demo.publish:
    description: Save a self-contained, one-screen HTML demo and run the code checks (honesty label, decision link, one screen, offline, no dead clicks)
    access: propose
  demo.check:
    description: Run the demo checks on an existing demo
    access: read
  docs.list:
    description: List strategy and product docs, with owner and last update
    access: read
  docs.read:
    description: Read one strategy or product doc in full
    access: read
  requests.search:
    description: Search customer requests logged by Sales and Customer Success. Returns distinct accounts and annual revenue at stake, counted once per account
    access: read
  code.list:
    description: List the files in the product codebase
    access: read
  code.read:
    description: Read one file from the product codebase
    access: read
  code.search:
    description: Find lines in the product codebase that match a pattern
    access: read
  code.propose:
    description: Propose a change on a copy of the codebase, as a pull request; runs the tests and reports the diff, new flags, and scope problems. Never merges
    access: propose
  code.test:
    description: Run the tests on a proposed change
    access: read
  design.system:
    description: The design system's tokens, components with examples, and class list
    access: read
  design.render:
    description: Render a design built from the design system, save a screenshot, and run the checks (system classes only, no inline styles, one screen)
    access: propose
  review.check:
    description: Run the code checks (numbers, quotes, fields, privacy) on a ledger entry
    access: read
  review.submit:
    description: Record a review verdict and findings. Code fills the checks and refuses SHIP when one failed
    access: propose
  mail.list:
    description: Your inbox since a time, with sender importance and a suspicious-sender flag
    access: read
  mail.read:
    description: One full email
    access: read
  chat.list:
    description: Channel messages and your direct messages, with unanswered hours for anything addressed to you
    access: read
  chat.thread:
    description: A chat message and its replies
    access: read
  calendar.list:
    description: Your events in a time range, with conflicts, missing agendas, back-to-backs, unsolicited invites, and focus minutes
    access: read
  transcripts.list:
    description: Meetings with transcripts, and past meetings that were not transcribed
    access: read
  transcripts.read:
    description: One meeting transcript with its attendees
    access: read
  directory.lookup:
    description: People by name, role, or team, with manager and reports
    access: read
  tracker.search:
    description: Tracker issues by keyword or status
    access: read
  mail.sent:
    description: Mail the PM sent, with whether each got an answer
    access: read
  loops.list:
    description: Open loops (waiting on the PM, waiting on others, and the PM's own promises) with days open
    access: read
  people.history:
    description: The PM's recent direct contact with one person
    access: read
  people.stale:
    description: Stakeholders past the contact cadence the PM set
    access: read
  calendar.context:
    description: Prep for one meeting (attendees, last contact, open loops and promises involving them, related past meetings)
    access: read
  calendar.free:
    description: The PM's free slots on a day, for proposing a new time
    access: read
  goals.get:
    description: The PM's goals with weights, and stakeholder cadences
    access: read
  goals.time:
    description: Meeting hours per goal in a period, with starved goals flagged
    access: read
  voice.samples:
    description: Recent messages the PM wrote, to match their voice
    access: read
  notify.self:
    description: Post a short note to the PM's own private channel
    access: self
  commitments.due:
    description: Open commitments from the ledger, sorted into overdue, due today, and upcoming
    access: read
  ledger.write:
    description: Append an artifact (signal card, decision packet, and so on) to the shared ledger. Invalid entries are rejected with reasons
    access: propose
  ledger.read:
    description: Read ledger entries
    access: read
