<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A PM's Monday</title>
<meta name="description" content="A day in the life of a PM running four agents: what each one read, did, and why, and the two calls only the PM makes.">
<style>
:root {
  --paper: #F7F6F2; --card: #FFFFFF; --ink: #1B1D21; --muted: #5F6570; --rule: #E3E1DA; --soft: #EFEDE6;
  --accent: #2B4EDB; --accent-soft: #E6EBFD; --ms: #C2410C; --goog: #2F6F4E; --ghost: #9AA0A8;
  --ok: #1F7A4D; --ok-soft: #E1F2E8; --warn: #9A5B00; --warn-soft: #FDF1DC; --bad: #B42318; --bad-soft: #FBE4E1;
  --chief: #7C3AED; --signal: #2B4EDB; --quality: #B45309; --builder: #0F766E; --you: #1B1D21; --code: #5F6570;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121316; --card: #1B1D22; --ink: #ECEDEF; --muted: #A1A6AF; --rule: #2C2F36; --soft: #22252B;
    --accent: #8FA6FF; --accent-soft: #232B47; --ms: #FB923C; --goog: #6BC49A; --ghost: #6B717A;
    --ok: #6BC49A; --ok-soft: #173024; --warn: #F2B35B; --warn-soft: #362914; --bad: #F2877D; --bad-soft: #3A1C1A;
    --chief: #B794F6; --signal: #8FA6FF; --quality: #F2B35B; --builder: #5EC7BA; --you: #ECEDEF; --code: #A1A6AF;
  }
}
:root[data-theme="dark"] {
  --paper: #121316; --card: #1B1D22; --ink: #ECEDEF; --muted: #A1A6AF; --rule: #2C2F36; --soft: #22252B;
  --accent: #8FA6FF; --accent-soft: #232B47; --ms: #FB923C; --goog: #6BC49A; --ghost: #6B717A;
  --ok: #6BC49A; --ok-soft: #173024; --warn: #F2B35B; --warn-soft: #362914; --bad: #F2877D; --bad-soft: #3A1C1A;
  --chief: #B794F6; --signal: #8FA6FF; --quality: #F2B35B; --builder: #5EC7BA; --you: #ECEDEF; --code: #A1A6AF;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
a { color: var(--accent); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.bar { max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
.brand { font-weight: 700; } .brand span { color: var(--muted); font-weight: 500; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button { font: inherit; font-size: 14px; border: 1px solid transparent; background: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--card); border-color: var(--rule); }
main { max-width: 1120px; margin: 0 auto; padding: 32px 24px 120px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-size: 40px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 12px; }
h2 { font-size: 24px; line-height: 1.25; letter-spacing: -0.01em; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 0 0 6px; }
p { margin: 0 0 12px; }
.lede { font-size: 19px; color: var(--muted); max-width: 760px; }
.muted { color: var(--muted); } .small { font-size: 14px; } .mono { font-family: var(--mono); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 20px; margin: 0 0 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stat { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.stat small { font-size: 14px; font-weight: 500; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); vertical-align: middle; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); }

/* The day */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0 40px; }
.stop { display: grid; grid-template-columns: 120px 1fr; gap: 24px; position: relative; padding-bottom: 36px; }
.stop::before { content: ""; position: absolute; left: 143px; top: 30px; bottom: 0; width: 2px; background: var(--rule); }
.stop:last-child::before { display: none; }
.when { text-align: right; padding-top: 4px; }
.when b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.when span { font-size: 12px; color: var(--muted); }
.dot { position: absolute; left: 136px; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 3px solid var(--who); }
.body { min-width: 0; padding-left: 24px; }
.who { font-size: 13px; font-weight: 700; color: var(--who); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0; }
.fact { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; }
.fact h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.fact ul { margin: 0; padding-left: 18px; font-size: 14px; } .fact li { margin: 2px 0; }
.why { border-left: 3px solid var(--who); padding: 2px 0 2px 12px; color: var(--muted); margin: 8px 0 12px; }
.you { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; margin: 0 0 14px; }
.brief-item { border-top: 1px solid var(--rule); padding: 12px 0; } .brief-item:first-of-type { border-top: 0; }
.brief-item .n { font-weight: 700; color: var(--chief); margin-right: 6px; }
.draft { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
.draft span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.claim { border-left: 3px solid var(--rule); padding: 2px 0 2px 12px; margin: 0 0 12px; font-size: 15px; }
.claim.fact { border-color: var(--signal); } .claim.assumption { border-color: var(--warn); }
.evidence { font-size: 13px; color: var(--muted); margin-top: 4px; }
blockquote { margin: 6px 0; padding: 8px 12px; background: var(--soft); border-radius: 8px; font-size: 14px; }
.callout { border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; background: var(--warn-soft); }
.callout.ok { background: var(--ok-soft); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; }
.btn[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.field { margin: 12px 0; } .field label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
details { margin: 8px 0; } summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td.date { white-space: nowrap; }
.diff { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--soft); border-radius: 10px; padding: 10px 0; overflow: auto; max-height: 520px; }
.diff div { padding: 0 12px; white-space: pre; }
.diff .add { background: var(--ok-soft); color: var(--ok); } .diff .del { background: var(--bad-soft); color: var(--bad); }
.diff .hunk { color: var(--accent); } .diff .file { font-weight: 700; color: var(--ink); }
.subtabs { display: flex; gap: 6px; margin: 0 0 12px; }
figure { margin: 0; } figure img { width: 100%; border: 1px solid var(--rule); border-radius: 10px; display: block; }
.scaler { position: relative; width: 100%; aspect-ratio: 1280 / 800; overflow: hidden; border: 1px solid var(--rule); border-radius: 10px; background: #fff; }
.scaler iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; }
iframe.brief { width: 100%; height: 70vh; border: 1px solid var(--rule); border-radius: 10px; background: #fff; margin-top: 8px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font: 12px var(--sans); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend b { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">Factory of One <span>a PM's Monday</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="day" aria-selected="true">The day</button>
      <button role="tab" data-tab="wrong" aria-selected="false">Where agents were wrong</button>
      <button role="tab" data-tab="how" aria-selected="false">How it works</button>
    </nav>
  </div>
</header>
<main>
  <section id="day"></section>
  <section id="wrong" class="hidden"></section>
  <section id="how" class="hidden"></section>
</main>
<script src="data/run.js"></script>
<script>
const R = window.RUN, C = R.chief;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = (v, d = 1) => v == null ? "n/a" : (v * 100).toFixed(d) + "%";
const usd = v => "$" + (v < 10 ? v.toFixed(2) : Math.round(v).toLocaleString("en-US"));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const seg = s => Object.entries(s || {}).map(([k, v]) => `${k} = ${[].concat(v).join(", ")}`).join("; ") || "everyone";
const label = ref => C?.labels?.[ref] || ref;
const person = id => C?.names?.[id] || id;
const mins = s => Math.max(1, Math.round(s / 60));
const chipV = v => `<span class="chip ${v === "SHIP" ? "ok" : v === "FIX" || v === "PROVE" ? "warn" : "bad"}">${esc(v)}</span>`;
// Chief cites refs like (chat:c_003) inside sentences. Show who it is instead.
const prose = t => esc(t).replace(/\s?\(?\b((?:mail|chat|cal|tr|trk):[a-z0-9_]+)\)?/g, (m, ref) => C?.labels?.[ref] ? ` <em class="muted">(${esc(C.labels[ref].split(": ")[0])})</em>` : m);

const bet = R.bet.payload, verdict = R.verdict.payload, packet = R.packet.payload, card = R.card.payload;
const W = R.weeks, actionWeek = W.indexOf(R.today);
const S = { approve: null, call: null, expected: bet.prediction.expected, confidence: bet.confidence };

// ---- The clock: agent steps take their real run time; your steps take the measured PM minutes ------------------
const secs = { chief: C?.usage?.seconds || 0, signal: R.agents.signal?.seconds || 0,
  qpacket: R.trace.find(t => t.station === "review" && /finished/.test(t.event))?.seconds || 0, builder: R.agents.builder?.seconds || 0,
  qbuilds: R.trace.filter(t => t.station === "build" && /quality finished/.test(t.event)).reduce((a, t) => a + t.seconds, 0) };
const briefWords = (C?.note || "").split(/\s+/).length + (C?.brief.top || []).map(t => `${t.why} ${t.next_step} ${t.draft_reply || ""}`).join(" ").split(/\s+/).length;
const gate = g => R.summary.gates.find(x => x.gate === g)?.pm_minutes || 0;
const you = { brief: Math.max(1, Math.round(briefWords / 200)), decide: gate("decide"), call: gate("call") };
let clock;
const tick = m => { const t = `${String(Math.floor(clock / 60)).padStart(2, "0")}:${String(Math.round(clock % 60)).padStart(2, "0")}`; clock += m; return t; };

// ---- Pieces ---------------------------------------------------------------------------------------------------------
function chart({ series, markers = [], upto = W.length }) {
  const w = 900, h = 250, L = 44, Rr = 16, T = 14, B = 30, y0 = 0.25, y1 = 0.45;
  const x = i => L + (i / (W.length - 1)) * (w - L - Rr), y = v => T + (1 - (v - y0) / (y1 - y0)) * (h - T - B);
  const dayX = iso => x((new Date(iso) - new Date(W[0])) / 864e5 / 7);
  let g = "";
  for (let v = 0.25; v <= 0.4501; v += 0.05) g += `<line x1="${L}" x2="${w - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  W.forEach((d, i) => { if (i % 2 === 0) g += `<text x="${x(i)}" y="${h - 8}" text-anchor="middle">${d.slice(5).replace("-", "/")}</text>`; });
  markers.forEach(m => { const X = dayX(m.date); g += `<line x1="${X}" x2="${X}" y1="${T}" y2="${h - B}" stroke="${m.color || "var(--muted)"}" stroke-dasharray="3 4"/><text x="${X + 6}" y="${T + 12}" style="fill:${m.color || "var(--muted)"}">${esc(m.label)}</text>`; });
  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null || i >= (s.upto ?? upto) ? null : [x(i), y(v)]).filter(Boolean);
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} points="${pts.map(p => p.join(",")).join(" ")}"/>`;
    pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.color}"/>`);
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weekly 7-day activation">${g}</svg><div class="legend">${series.map(s => `<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join("")}</div>`;
}
const releaseMarker = { date: R.release.date, label: R.release.id + " ships" };
const actionMarker = { date: R.today, label: "rollback", color: "var(--accent)" };

function tools(u) {
  if (!u?.tools) return "";
  return `<details><summary>Under the hood: ${u.calls} tool calls in ${u.turns} turns${u.cost_usd ? `, about ${usd(u.cost_usd)} at list price` : ""}</summary>
    <table><thead><tr><th>Capability</th><th>Calls</th><th>What it's for</th></tr></thead><tbody>
    ${u.tools.map(t => `<tr><td class="mono">${esc(t.capability)}</td><td>${t.calls}</td><td class="small">${esc(t.what)}</td></tr>`).join("")}</tbody></table>
    ${u.rejected_writes ? `<p class="small muted">The ledger rejected ${u.rejected_writes} of its writes as invalid, with reasons. It fixed them and resubmitted.</p>` : ""}</details>`;
}
function facts(read, did, checked) {
  const box = (h, items) => `<div class="fact"><h4>${h}</h4><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
  return `<div class="facts">${box("What it read", read)}${box("What it did", did)}${box("What code checked, not the model", checked)}</div>`;
}
function review(entryId) {
  const r = R.reviews[entryId];
  if (!r) return "";
  const checks = Object.entries(r.correctness).map(([k, v]) => `<span class="chip ${v === "pass" ? "ok" : v === "fail" ? "bad" : ""}">${esc(k)}: ${esc(v)}</span>`).join(" ");
  const f = r.findings.map(f => `<div class="claim assumption"><strong>${esc(f.severity)}</strong>: ${esc(f.claim)}<div class="evidence"><strong>Smallest fix:</strong> ${esc(f.smallest_action)}</div></div>`).join("");
  return `<p><strong>Quality</strong> ${chipV(r.verdict)} ${checks}</p>${f}`;
}
function claim(c) {
  const quotes = (c.evidence || []).filter(e => e.quote).map(e => `<blockquote>"${esc(e.quote)}" <span class="mono">${esc(e.ref)}</span></blockquote>`).join("");
  const values = (c.evidence || []).filter(e => !e.quote).map(e => `<span class="mono">${esc(e.ref)}</span> = ${esc(e.value)}`).join(" &middot; ");
  return `<div class="claim ${esc(c.class)}"><span class="chip">${esc(c.class)}</span> ${esc(c.text)}<div class="evidence">${values}</div>${quotes}
    ${c.does_not_prove ? `<div class="evidence"><em>Does not prove:</em> ${esc(c.does_not_prove)}</div>` : ""}</div>`;
}
function diff(text) {
  return `<div class="diff">${(text || "").split("\n").map(l => {
    const cls = l.startsWith("+++") || l.startsWith("---") ? "file" : l.startsWith("@@") ? "hunk" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
    return `<div class="${cls}">${esc(l) || " "}</div>`; }).join("")}</div>`;
}
function stop({ time, sub, who, color, title, body }) {
  return `<article class="stop" style="--who:var(${color})"><div class="when"><b>${time}</b><span>${sub || ""}</span></div><i class="dot"></i>
    <div class="body"><div class="who">${who}</div><h2>${title}</h2>${body}</div></article>`;
}

// ---- The day ----------------------------------------------------------------------------------------------------------
function renderDay() {
  clock = 7 * 60 + 30;
  const b = C.brief, tri = C.triage, inp = C.inputs;
  const top = b.top.map((t, i) => `<div class="brief-item"><span class="n">${i + 1}</span><strong>${esc(label(t.ref))}</strong>
      <p class="small" style="margin:4px 0 0">${prose(t.why)}</p><p class="small muted" style="margin:4px 0 0"><strong>Next:</strong> ${prose(t.next_step)}</p>
      ${t.draft_reply ? `<div class="draft">${esc(t.draft_reply)}<span>Drafted in your voice. Nothing was sent.</span></div>` : ""}</div>`).join("");
  const conflict = b.calendar.find(c => c.proposed_time);
  const starved = b.goal_check.filter(g => g.status === "starved");
  const approved = S.approve === "yes", decided = S.approve !== null;
  const triaged = Object.values(tri).reduce((a, n) => a + n, 0);

  let html = `<p class="eyebrow">Monday, March 2</p><h1>A PM's Monday with four agents</h1>
    <p class="lede">You're Sam, a growth PM at Tallybird, a simulated AI meeting notetaker. This is one real run: what each agent read, what it did, what code checked, and how long it took. The agents do the work. You make two calls.</p>
    <div class="summary">
      <div class="card"><div class="stat">${Math.round(you.brief + you.decide + you.call)} min <small>your time</small></div><p class="small muted">Reading and deciding</p></div>
      <div class="card"><div class="stat">${mins(secs.chief + secs.signal + secs.qpacket + secs.builder + secs.qbuilds)} min <small>agent time</small></div><p class="small muted">Chief, Signal, Quality, Builder</p></div>
      <div class="card"><div class="stat">${triaged} <small>emails triaged</small></div><p class="small muted">${C.drafts} replies drafted, none sent</p></div>
      <div class="card"><div class="stat">${pct(verdict.before)} &rarr; ${pct(verdict.after)}</div><p class="small muted">Microsoft activation, two weeks later</p></div>
    </div><div class="day">`;

  html += stop({ time: tick(mins(secs.chief)), sub: `${mins(secs.chief)} min`, who: "Chief &middot; chief of staff", color: "--chief",
    title: "Chief works through everything that came in since Friday",
    body: `<p class="why">Before you open your laptop. Without it, the morning goes to whoever emailed last. Chief ranks by your quarter's goals instead and drafts the replies, so you only approve them.</p>
    ${facts([`${inp.emails} emails`, `${inp.chats} chat messages you can see`, `${inp.meetings_today} meetings today`, `${inp.transcripts} meeting transcripts from last week`, `${inp.tracker_issues} tracker issues`, "Your 3 goals for the quarter", "Your sent mail, to learn your voice"],
      [`Triaged ${triaged} emails: ${tri.act_now} act now, ${tri.delegate} delegate, ${tri.answer_later} later, ${tri.ignore} ignore`, `Flagged ${C.suspicious} phishing email and drafted no reply to it`, `Found the ${b.needs_you.length} chats that need a decision from you`,
       `Pulled ${C.commitments.length} commitments from meetings and mail. ${C.overdue_promises.length} of yours is overdue`, `Caught a double booking and proposed ${conflict ? conflict.proposed_time.slice(11, 16) : "a new time"} for the ${esc(label(conflict?.ref || "").replace(/^\d\d:\d\d /, ""))}`,
       `Prepped ${b.meeting_prep.length} meetings: purpose, context, your ask`, starved.length ? `Flagged a goal with 0 hours this week` : "Checked time against goals", `Spotted ${esc(person(b.stale[0]?.person))} going quiet: ${b.stale[0]?.days_since} days`],
      ["Who matters, from the org chart", "Lookalike and suspicious senders", "Who already replied to whom", "Calendar conflicts and free slots", "Hours per goal", "Days since you last talked to each stakeholder"])}
    ${tools(C.usage)}` });

  html += stop({ time: tick(you.brief), sub: `~${you.brief} min`, who: "You", color: "--you", title: "You read one short note, not an inbox",
    body: `<div class="you"><h3>What Chief posted to your private channel</h3><p style="white-space:pre-line;margin:0">${esc(C.note)}</p></div>
    <div class="card"><h3>The top 3, with replies ready</h3>${top}</div>
    <details><summary>The rest of the brief: open loops, meeting prep, follow-ups, calendar</summary><iframe class="brief" src="${esc(C.brief_page)}" title="Chief's full morning brief"></iframe></details>
    <p class="why">Item 1 is the day's real question. Dana, your VP, wants "one number, one decision" on activation for the 11:00 leadership sync. You hand it to Signal.</p>` });

  html += stop({ time: tick(mins(secs.signal)), sub: `${mins(secs.signal)} min`, who: "Signal &middot; analyst", color: "--signal",
    title: `Activation fell for ${cap(seg(packet.diagnosis.segment).split(" = ")[1] || "one segment")} calendar users after ${esc(packet.diagnosis.release_id)}`,
    body: `<p class="why">A dashboard shows the dip, not the cause. Signal asks the metrics layer for the numbers, reads support tickets for the customers' words, and checks every release in the window. It hands focused questions to two sub-agents: one for numbers, one for customer voice.</p>
    <div class="grid" style="margin-bottom:12px">
      <div class="card"><div class="stat">${pct(card.before.value)} &rarr; ${pct(card.after.value)}</div><p class="small muted">All workspaces, before vs after the release</p></div>
      <div class="card"><div class="stat">${usd(packet.size.value)} <small>a week</small></div><p class="small muted">New revenue at risk, from the sizing tool</p></div>
      <div class="card"><div class="stat">${packet.diagnosis.voice_workspaces} <small>workspaces</small></div><p class="small muted">Filed tickets describing the block</p></div>
    </div>
    <div class="card">${chart({ series: [{ name: "Microsoft calendar", values: R.series.with_action.microsoft, color: "var(--ms)", upto: actionWeek - 1 },
      { name: "Google calendar", values: R.series.with_action.google, color: "var(--goog)", upto: actionWeek - 1 }], markers: [releaseMarker] })}</div>
    ${facts(["The metric catalog: 6 registered metrics", "Weekly signup cohorts by calendar provider, channel, and company size", "Every release in the window", "Support tickets, searched by phrase"],
      [`Localized the drop to ${esc(seg(packet.diagnosis.segment))}; the other providers held flat`, `Tied the onset to ${esc(packet.diagnosis.release_id)}, shipped ${R.release.date}`, `Found the step that broke: ${esc(packet.diagnosis.mechanism_metric)}`, `Sized it and recommended a ${esc(packet.recommended_action.name)} for that segment only`],
      ["Every number is replayed from the query it cites", "The headline is recomputed from its metric, periods, and segment", "Quotes match a real ticket or release note word for word", "Cohorts younger than 7 days are refused, not averaged in"])}
    <details><summary>The evidence: ${packet.cause.length} claims, what each does not prove, and what was ruled out</summary>${packet.cause.map(claim).join("")}${(packet.ruled_out || []).map(claim).join("")}</details>
    ${tools(R.usage.signal)}` });

  const pv = R.reviews[R.packet.id]?.verdict;
  html += stop({ time: tick(mins(secs.qpacket)), sub: `${mins(secs.qpacket)} min`, who: "Quality &middot; reviewer", color: "--quality",
    title: pv === "SHIP" ? "Quality tries to break the diagnosis, and can't" : "Quality sends one number back",
    body: `<p class="why">The agent that wrote a claim is the worst judge of it. Quality runs the code checks first, then tries to disprove the story: another segment with the same drop, an onset before the release, a correlated cause.</p>
    <div class="card">${review(R.packet.id)}</div>
    ${pv !== "SHIP" ? `<p class="small muted">The flag is on a supporting number, not the diagnosis. Whether to act anyway is your call.</p>` : ""}${tools(R.usage.quality_packet)}` });

  html += stop({ time: tick(you.decide), sub: `~${you.decide} min`, who: "You &middot; call 1 of 2", color: "--you",
    title: `Roll back ${esc(R.release.id)} for Microsoft calendar users?`,
    body: `<div class="you"><p>Signal recommends a <span class="mono">${esc(packet.recommended_action.name)}</span> of ${esc(R.release.id)} for ${esc(seg(packet.recommended_action.params.segment))} only. Everyone else keeps the new onboarding. Agents propose; only a person places the bet.</p>
      <div class="actions" style="margin-top:0"><button class="btn" data-approve="yes" aria-pressed="${approved}">Approve and bet</button><button class="btn" data-approve="no" aria-pressed="${S.approve === "no"}">Decline</button></div>
      <div class="${approved ? "" : "hidden"}"><h3 style="margin-top:16px">Your bet</h3>
      <p class="small muted">Predict Microsoft activation for the first cohort after the rollback. You're scored when the data matures, with a tolerance of ${pct(bet.prediction.tolerance)}.</p>
      <div class="field"><label>Predicted activation <span id="ev">${pct(S.expected)}</span></label><input type="range" id="expected" min="0.28" max="0.44" step="0.005" value="${S.expected}"></div>
      <div class="field"><label>Confidence it lands within ${pct(bet.prediction.tolerance)} <span id="cv">${Math.round(S.confidence * 100)}%</span></label><input type="range" id="confidence" min="0.5" max="0.99" step="0.01" value="${S.confidence}"></div>
      <p class="small muted" style="margin:0">The PM in this run bet ${pct(bet.prediction.expected)} at ${Math.round(bet.confidence * 100)}%. Microsoft's baseline before the release was about ${pct(R.series.with_action.microsoft.slice(0, 5).reduce((a, v) => a + v, 0) / 5)}.</p></div></div>` });

  if (approved) {
    html += stop({ time: tick(mins(secs.builder)), sub: `${mins(secs.builder)} min`, who: "Builder &middot; engineer and designer", color: "--builder",
      title: "Builder turns your decision into code, a design, and a demo for Dana",
      body: `<p class="why">Dana's sync is at 11:00. A working change behind a flag, the screen blocked users will see, and a one-screen page for the VP turn a recommendation into a yes. Code first checks that Builder proposed exactly what you approved.</p>
      <div class="subtabs">${R.builds.map((x, i) => `<button class="btn" data-build="${i}" aria-pressed="${i === 0}">${{ mvp: "Code change", design: "Design", prototype: "Demo for Dana" }[x.kind]} ${chipV(x.review?.verdict)}</button>`).join("")}</div>
      <div id="buildview"></div>
      ${facts(["The approved bet and Signal's packet", "The product code: onboarding, screens, feature flags, tests", "Tallybird's design system: tokens and components"],
        ["Added a feature flag, off by default, scoped to Microsoft calendar users", "Wrote tests for it; every test passes", "Designed the step a blocked user sees, with an admin-approval banner", "Built a one-screen page for Dana: one number, one ask"],
        ["Tests rerun by code, never taken on Builder's word", "Scope: the new flag ships off, a new test exists, no test was removed", "Hidden acceptance tests that Builder never sees", "The design uses only system components; the demo has no dead clicks"])}
      ${tools(R.usage.builder)}` });
    html += stop({ time: tick(mins(secs.qbuilds)), sub: `${mins(secs.qbuilds)} min`, who: "Quality &middot; reviewer", color: "--quality",
      title: `Quality reviews each build for its own reader: ${R.builds.map(x => x.review?.verdict).join(", ")}`,
      body: `<p class="why">Three builds for three readers: engineering, the user, and the VP. Each is judged against its own purpose. Its verdicts are on the tabs above.</p>${tools(R.usage.quality_build)}` });
    html += stop({ time: "09:30", sub: "then 11:00", who: "You", color: "--you", title: "You walk Dana through it, and the leadership sync approves",
      body: `<p>You send Dana the readout with the demo, starting from Chief's drafted reply. At 11:00 the rollback is approved, engineering merges the change, and the flag turns on for Microsoft calendar users.</p>
      <p class="small muted">In the simulation, the rollback applies from Monday and the world runs forward two weeks with the same users.</p>` });
  }

  if (decided) {
    const mine = approved ? R.series.with_action.microsoft : R.series.no_action.microsoft;
    const other = approved ? R.series.no_action.microsoft : R.series.with_action.microsoft;
    html += stop({ time: "Mar 16", sub: "two weeks later", who: "Code &middot; the verdict", color: "--code",
      title: approved ? `Microsoft activation: ${pct(verdict.before)} &rarr; ${pct(verdict.after)}` : `You declined. Microsoft activation stayed at ${pct(mine[actionWeek])}.`,
      body: `<p class="why">No agent grades its own work. A script compares mature cohorts after the action with the weeks before, and states what it does not prove.</p>
      <div class="card"><h3>Microsoft calendar users, both worlds</h3><p class="small muted">Same simulated users, same randomness. The only difference is your decision.</p>
      ${chart({ series: [{ name: approved ? "Your world: rolled back" : "Your world: no action", values: mine, color: "var(--ms)" }, { name: approved ? "Had you declined" : "Had you approved", values: other, color: "var(--ghost)", dash: "5 5", width: 2 },
        { name: "Google calendar", values: R.series.with_action.google, color: "var(--goog)", width: 1.5 }], markers: [releaseMarker, actionMarker] })}</div>
      <p class="small">${esc(verdict.method)} <span class="muted">Does not prove: ${esc(verdict.does_not_prove)}</span></p>` });
    html += stop({ time: "Mar 16", sub: approved ? `~${you.call} min` : "", who: approved ? "You &middot; call 2 of 2" : "You", color: "--you", title: approved ? "Ship, iterate, or kill?" : "What waiting cost",
      body: approved ? `<div class="you">${[["ship", "Ship", "Keep the rollback and stop here"], ["iterate", "Iterate", "Keep it, and retest the new onboarding behind a flag with a fallback"], ["kill", "Kill", "Undo the rollback"]].map(([k, l, d]) =>
          `<p style="margin:6px 0"><button class="btn" data-call="${k}" aria-pressed="${S.call === k}">${l}</button> <span class="small muted">${d}</span></p>`).join("")}</div>${S.call ? score() : ""}`
        : `<div class="card"><div class="stat">~${usd(packet.size.value * 2)} <small>new revenue at risk over two weeks</small></div><p class="small muted">Signal's weekly size, times the two weeks you waited.</p></div>${planted()}` });
  }
  html += `</div>`;
  if (!decided) html += `<p class="muted" style="margin-left:168px">Make call 1 to continue the day.</p>`;
  $("#day").innerHTML = html;
  if (approved) renderBuild(0);
}

function score() {
  const hit = Math.abs(verdict.after - S.expected) <= bet.prediction.tolerance;
  const brier = Math.pow(S.confidence - (hit ? 1 : 0), 2);
  return `<div class="callout ${S.call === R.call.payload.decision ? "ok" : ""}">You chose <strong>${esc(S.call)}</strong>. The run's PM chose <strong>${esc(R.call.payload.decision)}</strong>: ${esc(R.call.payload.rationale)}</div>
    <div class="grid"><div class="card"><div class="stat">${brier.toFixed(2)} <small>your Brier score</small></div><p class="small muted">0 is perfect. You bet ${pct(S.expected)} at ${Math.round(S.confidence * 100)}%; it came in at ${pct(verdict.after)}. ${hit ? "Landed." : "Missed."}</p></div>
    <div class="card"><div class="stat">${R.summary.brier.toFixed(2)} <small>the run's PM</small></div><p class="small muted">Bet ${pct(bet.prediction.expected)} at ${Math.round(bet.confidence * 100)}%</p></div></div>${planted()}`;
}
function planted() {
  return `<h3 style="margin-top:18px">What was planted in the data</h3><div class="card"><p><strong>Cause:</strong> ${esc(R.truth.cause.mechanism)}</p>
    <details><summary>The traps a careless analysis falls into (${R.truth.traps.length})</summary><ul>${R.truth.traps.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details></div>`;
}

function renderBuild(i) {
  const b = R.builds[i];
  document.querySelectorAll("[data-build]").forEach(el => el.setAttribute("aria-pressed", el.dataset.build == i));
  let body = "";
  if (b.kind === "mvp") body = `<p>${esc(b.message)}</p>${diff(b.diff)}`;
  else if (b.kind === "design") body = `<p class="small muted">What a blocked Microsoft user sees with the flag on, built only from Tallybird's design system.</p><figure><img src="${esc(b.path)}" alt="The calendar step with an admin-approval banner and a Skip for now button"></figure>`;
  else body = `<p class="small muted">The page you send Dana: one number, one ask. Labeled "${esc(b.honesty)}": the numbers were copied in at build time.</p><div class="scaler"><iframe src="${esc(b.path)}" title="Builder's demo for the VP"></iframe></div>`;
  $("#buildview").innerHTML = `<div class="card">${body}<div style="margin-top:12px">${review(b.id)}</div></div>`;
  fitDemo();
}
function fitDemo() { document.querySelectorAll(".scaler").forEach(el => el.firstElementChild.style.transform = `scale(${el.clientWidth / 1280})`); }
window.addEventListener("resize", fitDemo);

function renderWrong() {
  $("#wrong").innerHTML = `<p class="eyebrow">Every live run, including the bad ones</p><h1>Where the agents were wrong, and what changed</h1>
    <p class="lede">A failure found in a live run becomes a fix and, where it can recur, a new eval case. Graders had bugs too; those are logged in the repo.</p>
    <div class="card"><table><thead><tr><th>Date</th><th>Run</th><th>Result</th><th>What it found</th></tr></thead><tbody>
    ${R.live_runs.map(r => `<tr><td class="small date">${esc(r.date)}</td><td>${esc(r.run)}</td><td>${esc(r.result)}</td><td class="small">${esc(r.found).replace(/`([^`]+)`/g, "<code>$1</code>")}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function renderHow() {
  const rows = [["Chief", "Your morning: triage, open loops, meeting prep, replies in your voice", "Sender weight, conflicts, free time, staleness"],
    ["Signal", "What changed and why, with numbers and customer voice", "Every number, by replaying the query it cites"],
    ["Quality", "Reviews every artifact before you see it", "Numbers, quotes, fields, privacy; refuses SHIP when a check fails"],
    ["Builder", "A code change behind a flag, a design, a demo", "Reruns tests, checks scope, runs hidden acceptance tests"]];
  $("#how").innerHTML = `<p class="eyebrow">How it works</p><h1>Agents do the work. Code owns the facts. You own the calls.</h1>
    <div class="card"><table><thead><tr><th>Agent</th><th>Does</th><th>Code checks</th></tr></thead><tbody>${rows.map(r => `<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td class="small">${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <div class="grid">
      <div class="card"><h3>A simulated company</h3><p class="small">Tallybird's data comes from a seeded model with problems planted on purpose, so every answer can be graded. Change one decision and only the future changes.</p></div>
      <div class="card"><h3>Your tools, not ours</h3><p class="small">Agents name capabilities, like "search tickets". Each install maps them to real tools in one file: the sandbox, or your company's Gmail, Slack, and Zendesk.</p></div>
      <div class="card"><h3>Evals, not vibes</h3><p class="small">Every agent has tasks, graders, and answer keys. Live runs are regraded when a grader changes, and every failure is logged.</p></div>
    </div><p><a href="https://github.com/Azmuirr/factory-of-one">Read the code and run it yourself</a></p>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  const keep = fn => { const y = window.scrollY; fn(); window.scrollTo({ top: y }); };
  if (t.dataset.tab) {
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t.dataset.tab));
    ["day", "wrong", "how"].forEach(id => $("#" + id).classList.toggle("hidden", id !== t.dataset.tab));
    window.scrollTo({ top: 0 });
  } else if (t.dataset.approve) keep(() => { S.approve = t.dataset.approve; S.call = null; renderDay(); });
  else if (t.dataset.call) keep(() => { S.call = t.dataset.call; renderDay(); });
  else if (t.dataset.build) renderBuild(Number(t.dataset.build));
});
document.addEventListener("input", e => {
  if (e.target.id === "expected") { S.expected = Number(e.target.value); $("#ev").textContent = pct(S.expected); }
  if (e.target.id === "confidence") { S.confidence = Number(e.target.value); $("#cv").textContent = Math.round(S.confidence * 100) + "%"; }
});
renderDay(); renderWrong(); renderHow();
</script>
</body>
</html>
