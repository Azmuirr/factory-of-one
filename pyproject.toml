[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-of-one"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6", "jsonschema>=4.18", "mcp>=2.2", "playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sandbox*", "factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
