name: signal
version: 0.3.10
model: sonnet
max_turns: 40
skill: SKILL.md
# The lead only writes and reads the ledger. Its sub-agents hold the data tools.
capabilities: [ledger.write, ledger.read]
subagents:
  quant:
    description: Quantitative analyst. Computes metrics, period comparisons, segment splits, funnel steps, and revenue impact. Returns exact tool numbers.
    prompt_file: quant.md
    capabilities: [metrics.list, metrics.get, metrics.compare, metrics.size_impact, warehouse.describe, warehouse.query, releases.list]
  qual:
    description: Qualitative analyst. Finds customer voice in support tickets and release notes, counts distinct accounts, and returns exact quotes.
    prompt_file: qual.md
    capabilities: [support.search, support.volume, support.get, releases.list]
