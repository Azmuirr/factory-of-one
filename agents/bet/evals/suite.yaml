agent: bet
version: 0.1.0
defaults:
  trials: 3
  seed: 1

tasks:
  - id: frame-s01
    kind: capability
    scenario: s01-calendar-gate
    reference: agents/bet/evals/fixtures/reference-candidates.jsonl
    setup:
      - copy_files: {from: ledger/examples/queries.jsonl, to: queries.jsonl}
      - seed_ledger: {file: ledger/examples/s01-happy-path.jsonl, ids: [sig_0001, pkt_0001, rev_0001]}
    prompt: It is Monday 2026-03-02. Frame the work coming in and rank the bets for this week.
    graders:
      - bet_ranking
      - {type: code, name: passes_quality_checks, params: {agent: bet}}
      - {type: code, name: tools_within_allowlist, params: {servers: [ledger, workplace, requests, metrics]}}
